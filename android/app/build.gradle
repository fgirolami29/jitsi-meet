apply plugin: 'com.android.application'

// Crashlytics integration is done as part of Firebase now, so it gets
// automagically activated with google-services.json
if (googleServicesEnabled) {
    apply plugin: 'com.google.firebase.crashlytics'
}

// Use the number of seconds/10 since Jan 1 2019 as the versionCode.
// This lets us upload a new build at most every 10 seconds for the
// next ~680 years.
// https://stackoverflow.com/a/38643838
def vcode = (int) (((new Date().getTime() / 1000) - 1546297200) / 10)
def requiredBmjEnvironment = { String name ->
    def value = System.getenv(name)

    if (value == null || value.trim().isEmpty()) {
        throw new GradleException(
            "${name} is required. Use the CodeCorn Android build script."
        )
    }

    value.trim()
}

def parseBmjHttpsUri = { String name, String value ->
    java.net.URI uri

    try {
        uri = new java.net.URI(value)
    } catch (Exception error) {
        throw new GradleException(
            "${name} is not a valid URI: ${value}",
            error
        )
    }

    if (!'https'.equalsIgnoreCase(uri.scheme) || !uri.host) {
        throw new GradleException(
            "${name} must be an absolute HTTPS URL: ${value}"
        )
    }

    uri
}

def validateBmjPath = { String name, String value ->
    if (!value.startsWith('/')
            || value.contains('?')
            || value.contains('#')
            || value.contains('://')) {
        throw new GradleException(
            "${name} must be an absolute path without query or fragment: ${value}"
        )
    }
}

def escapeBuildConfigString = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"')
}

def bmjServerUrl = requiredBmjEnvironment('BMJ_SERVER_URL')
def bmjExitUrl = requiredBmjEnvironment('BMJ_EXIT_URL')
def bmjAppLinkPath = requiredBmjEnvironment('BMJ_APP_LINK_PATH')
def bmjConferencePath = requiredBmjEnvironment('BMJ_CONFERENCE_PATH')

def bmjServerUri = parseBmjHttpsUri('BMJ_SERVER_URL', bmjServerUrl)
def bmjExitUri = parseBmjHttpsUri('BMJ_EXIT_URL', bmjExitUrl)

def bmjServerPath = bmjServerUri.path ?: ''

if (!(bmjServerPath == '' || bmjServerPath == '/')
        || bmjServerUri.rawQuery != null
        || bmjServerUri.rawFragment != null
        || bmjServerUri.rawUserInfo != null) {
    throw new GradleException(
        "BMJ_SERVER_URL must contain only scheme and authority: ${bmjServerUrl}"
    )
}

if (!bmjServerUri.host.equalsIgnoreCase(bmjExitUri.host)) {
    throw new GradleException(
        "BMJ_SERVER_URL and BMJ_EXIT_URL must use the same host: "
            + "${bmjServerUri.host} != ${bmjExitUri.host}"
    )
}

validateBmjPath('BMJ_APP_LINK_PATH', bmjAppLinkPath)
validateBmjPath('BMJ_CONFERENCE_PATH', bmjConferencePath)

def bmjAppLinkHost = bmjServerUri.host

def escapedBmjServerUrl = escapeBuildConfigString(bmjServerUrl)
def escapedBmjExitUrl = escapeBuildConfigString(bmjExitUrl)
def escapedBmjAppLinkHost = escapeBuildConfigString(bmjAppLinkHost)
def escapedBmjAppLinkPath = escapeBuildConfigString(bmjAppLinkPath)
def escapedBmjConferencePath = escapeBuildConfigString(bmjConferencePath)

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    packagingOptions {
        exclude 'lib/*/libhermes*.so'
    }

    defaultConfig {
        applicationId 'it.barbagiamusei.live'
        versionCode vcode
        versionName project.appVersion

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        manifestPlaceholders = [
            bmjAppLinkHost: bmjAppLinkHost,
            bmjAppLinkPath: bmjAppLinkPath
        ]

        resValue "string", "bmj_server_url", bmjServerUrl

        buildConfigField "String", "BMJ_SERVER_URL", "\"${escapedBmjServerUrl}\""
        buildConfigField "String", "BMJ_EXIT_URL", "\"${escapedBmjExitUrl}\""
        buildConfigField "String", "BMJ_APP_LINK_HOST", "\"${escapedBmjAppLinkHost}\""
        buildConfigField "String", "BMJ_APP_LINK_PATH", "\"${escapedBmjAppLinkPath}\""
        buildConfigField "String", "BMJ_CONFERENCE_PATH", "\"${escapedBmjConferencePath}\""

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "GOOGLE_SERVICES_ENABLED", "${googleServicesEnabled}"
            buildConfigField "boolean", "LIBRE_BUILD", "${rootProject.ext.libreBuild}"
        }
        release {
            // Uncomment the following line for singing a test release build.
            //signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules-release.pro'
            buildConfigField "boolean", "GOOGLE_SERVICES_ENABLED", "${googleServicesEnabled}"
            buildConfigField "boolean", "LIBRE_BUILD", "${rootProject.ext.libreBuild}"
        }

        /*
         * Build di laboratorio con comportamento React Native release:
         * bundle JS incorporato, Metro e LogBox disabilitati.
         * La firma debug consente l'installazione sull'emulatore.
         */
        labRelease {
            initWith release

            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false

            matchingFallbacks = [ 'release' ]
        }
    }

    sourceSets {
        main {
            java {
                if (rootProject.ext.libreBuild) {
                    srcDir "src"
                    exclude "**/GoogleServicesHelper.java"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // https://github.com/facebook/react-native/issues/31572
    // We can update past 1.4.0 on RN 0.68
    implementation ('androidx.appcompat:appcompat:1.3.1') {
        version {
            strictly '1.3.1'
        }
    }

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.7'

    if (!rootProject.ext.libreBuild) {
        implementation 'com.google.android.gms:play-services-auth:16.0.1'

        // Firebase
        //  - Crashlytics
        //  - Dynamic Links
        implementation 'com.google.firebase:firebase-analytics:17.5.0'
        implementation 'com.google.firebase:firebase-crashlytics:17.2.1'
        implementation 'com.google.firebase:firebase-dynamic-links:19.1.0'
    }

    implementation project(':sdk')
}

gradle.projectsEvaluated {
    // Dropbox integration
    //

    def dropboxAppKey
    if (project.file('dropbox.key').exists()) {
        dropboxAppKey = project.file('dropbox.key').text.trim() - 'db-'
    }

    if (dropboxAppKey) {
        android.defaultConfig.resValue('string', 'dropbox_app_key', "${dropboxAppKey}")

        def dropboxActivity = """
          <activity
              android:configChanges="keyboard|orientation"
              android:exported="true"
              android:launchMode="singleTask"
              android:name="com.dropbox.core.android.AuthActivity">
            <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.BROWSABLE" />
              <category android:name="android.intent.category.DEFAULT" />
              <data android:scheme="db-${dropboxAppKey}" />
            </intent-filter>
          </activity>"""

        android.applicationVariants.all { variant ->
            variant.outputs.each { output ->
                output.getProcessManifestProvider().get().doLast {
                    def outputDir = multiApkManifestOutputDirectory.get().asFile
                    def manifestPath = new File(outputDir, 'AndroidManifest.xml')
                    def charset = 'UTF-8'
                    def text
                    text = manifestPath.getText(charset)
                    text = text.replace('</application>', "${dropboxActivity}</application>")
                    manifestPath.write(text, charset)
                }
            }
        }
    }

    // Run React packager
    android.applicationVariants.all { variant ->
        def targetName = variant.name.capitalize()

        def currentRunPackagerTask = tasks.create(
            name: "run${targetName}ReactPackager",
            type: Exec) {
            group = "react"
            description = "Run the React packager."

            doFirst {
                println "Starting the React packager..."

                def androidRoot = file("${projectDir}/../")

                // Set up the call to the script
                workingDir androidRoot

                // Run the packager
                commandLine("scripts/run-packager.sh")
            }

            // Set up dev mode
            def devEnabled = !targetName.toLowerCase().contains("release")

            // Only enable for dev builds
            enabled devEnabled
        }

        def packageTask = variant.packageApplicationProvider.get()

        packageTask.dependsOn(currentRunPackagerTask)
    }

}

if (googleServicesEnabled) {
    apply plugin: 'com.google.gms.google-services'
}
